[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stratos-ai"
version = "0.1.0"
description = "Strategic Team Reasoning and Adaptive Tactical Operations System - Multi-Agent Reinforcement Learning Research Prototype"
authors = [{ name = "NEXUS AI Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pygame>=2.5.0",
    "streamlit>=1.30.0",
    "pettingzoo>=1.24.0",
    "gymnasium>=0.29.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
